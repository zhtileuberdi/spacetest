<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TestSpace</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--page:#f5f6fa;--bg:#ffffff;--side:#f8f9fc;--bar:#ffffff;--bd:#e6e8ef;--tx:#23232f;--mut:#6b7280;--acc:#ef5b4a;--accd:#d94534;--ok:#16a34a;--warn:#d97706;--err:#dc2626;--ed:#fbfbfd;--sel:#fdeeec;--hov:#f3f4f8;--sh:0 2px 14px rgba(30,30,60,.07)}
.dark{--page:#14141a;--bg:#1d1d25;--side:#24242e;--bar:#1d1d25;--bd:#33333f;--tx:#ececf1;--mut:#9ca3af;--acc:#ff6f5e;--accd:#ff8576;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;--ed:#17171d;--sel:#3a2626;--hov:#2a2a35;--sh:0 2px 14px rgba(0,0,0,.35)}
*{box-sizing:border-box}h1,h2,h3,p{margin:0}button,input,select,textarea{font-family:inherit;font-size:inherit}
body{background:var(--page);color:var(--tx);font:15px/1.55 Montserrat,'Segoe UI',system-ui,sans-serif;margin:0}
.mono{font-family:Consolas,'Cascadia Code','Courier New',monospace}.mut{color:var(--mut)}.ok{color:var(--ok)}.err{color:var(--err)}.grow{flex:1}
.nav{min-height:68px;background:var(--bar);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:8px 28px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}.brand b{display:block;letter-spacing:.06em;font-size:18px;line-height:1.1}.brand small{color:var(--mut);font-size:11px}
.logo-mk{width:38px;height:38px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.navmid{display:flex;gap:24px;margin-left:28px;flex:1;overflow-x:auto}.nl{cursor:pointer;font-weight:500;padding:6px 2px;border-bottom:2px solid transparent;white-space:nowrap}.nl:hover,.nl.on{color:var(--acc)}.nl.on{border-bottom-color:var(--acc)}
.logo{color:var(--acc);font-weight:600}
.inp{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;outline:0;width:auto}.inp:focus{border-color:var(--acc)}.nav .inp{padding:6px 8px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 20px;cursor:pointer;font-weight:600}.btn:hover{background:var(--accd)}.btn:disabled{opacity:.5}
.btn.lg{padding:16px 34px;font-size:17px;border-radius:12px}.btn.w{background:#fff;color:var(--acc);border-radius:999px;padding:8px 22px}.btn.sm{padding:6px 14px;font-size:13px}
.btn2{background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:500}.btn2:hover{background:var(--hov)}.btn2.coral{border-color:var(--acc);color:var(--acc)}
.dng{color:var(--err);cursor:pointer;background:none;border:0;font-size:13px}
.content{max-width:1120px;margin:0 auto;padding:26px 20px 90px}
.pg{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}.pg h1{font-size:28px;font-weight:700;line-height:1.2}.pg p{color:var(--mut);margin-top:4px}
.panel{background:var(--bg);border:1px solid var(--bd);border-radius:16px;margin-bottom:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh)}
.ph{padding:11px 18px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);background:var(--side);border-bottom:1px solid var(--bd)}
.pb{padding:18px}.row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--bd);flex-wrap:wrap}.row:last-child{border:0}
.av{width:32px;height:32px;border-radius:50%;background:var(--sel);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}.grid2>.panel{margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px}
.tile{background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:16px 18px;box-shadow:var(--sh);display:flex;gap:14px;align-items:center}.tile b{display:block;font-size:26px;font-weight:700;line-height:1.1}
.ti{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}.ti.c1{background:#e0e7ff;color:#4338ca}.ti.c2{background:#dcfce7;color:#15803d}.ti.c3{background:#fef3c7;color:#b45309}.ti.c4{background:#fee2e2;color:#b91c1c}
.dark .ti{filter:brightness(.9)}
.chip{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--bd);color:var(--mut)}
.b-ok{color:var(--ok);border-color:var(--ok)}.b-warn{color:var(--warn);border-color:var(--warn)}.b-err{color:var(--err);border-color:var(--err)}
.tcard{background:var(--bg);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:20px;border-top:5px solid var(--acc);display:flex;flex-direction:column;gap:12px;transition:transform .15s}.tcard:hover{transform:translateY(-2px)}
.tcard h3{font-size:18px;font-weight:700}.tcard .meta{display:flex;gap:6px;flex-wrap:wrap}.tcard .act{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{text-align:center;padding:44px 20px;background:var(--bg);border:2px dashed var(--bd);border-radius:16px}.empty .big{font-size:40px;color:var(--acc);font-weight:700}.empty h3{margin:8px 0 4px;font-size:18px}.empty p{color:var(--mut);max-width:420px;margin:0 auto 16px}
.tbw{overflow-x:auto}table.tb{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}table.tb th{text-align:left;font-weight:600;color:var(--mut);padding:10px 16px;border-bottom:1px solid var(--bd);font-size:12px;text-transform:uppercase}table.tb td{padding:11px 16px;border-bottom:1px solid var(--bd);vertical-align:top}
.log{background:var(--ed);font-size:13px;padding:12px 16px;max-height:220px;overflow:auto;margin:0;white-space:pre-wrap}
.bar{height:10px;background:var(--bd);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:5px}
.form{display:grid;gap:12px}.form label{font-size:13px;font-weight:600;color:var(--mut)}.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tp{border:2px solid var(--bd);border-radius:14px;padding:14px;cursor:pointer;background:var(--bg)}.tp.on{border-color:var(--acc);background:var(--sel)}.tp b{display:block}.tp span{font-size:13px;color:var(--mut)}
.kopt{display:flex;gap:10px;align-items:center}.kopt .kb{width:38px;height:38px;border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}.kopt .inp{flex:1;min-width:0}
.k0{background:#e21b3c}.k1{background:#1368ce}.k2{background:#d89e00}.k3{background:#26890c}
.savebar{position:sticky;bottom:0;background:var(--bar);border-top:1px solid var(--bd);padding:12px 20px;margin:20px -20px -90px;display:flex;justify-content:flex-end;gap:10px}
/* лендинг */
.hero{display:grid;grid-template-columns:1fr 1.05fr;gap:50px;max-width:1200px;margin:0 auto;padding:60px 28px 40px;align-items:center}
.hero h1{font-size:56px;font-weight:700;line-height:1.1}.hero h1 sup{font-size:18px;color:var(--ok);font-weight:600;margin-left:6px;vertical-align:super}
.hl p{font-size:19px;color:var(--mut);margin:22px 0 30px;line-height:1.65}.cta{display:flex;align-items:center;gap:26px;flex-wrap:wrap}.demo-l{cursor:pointer;font-weight:600}.demo-l:hover{color:var(--acc)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:34px}
.art{position:relative;width:100%;aspect-ratio:1/.92;container-type:inline-size}
.blob{position:absolute;left:8%;top:6%;width:84%;height:88%;border-radius:50%;background:var(--sel)}
.win{position:absolute;left:2%;top:10%;width:76%;height:58%;background:var(--bg);border-radius:2.4cqw;box-shadow:0 2cqw 5cqw rgba(60,30,30,.18);overflow:hidden;border:1px solid var(--bd)}
.wbar{height:6cqw;background:var(--side);display:flex;gap:1cqw;align-items:center;padding:0 2cqw;border-bottom:1px solid var(--bd)}.wbar i{width:1.6cqw;height:1.6cqw;border-radius:50%;background:#d1d5db}.wbar i:first-child{background:#f87171}.wbar i:nth-child(2){background:#fbbf24}.wbar i:nth-child(3){background:#4ade80}
.wbody{display:grid;grid-template-columns:.8fr 1.2fr;height:calc(100% - 6cqw)}.wl{padding:2.4cqw;display:grid;gap:1.4cqw;align-content:start}.wl i{display:block;height:1.6cqw;border-radius:1cqw;background:var(--bd)}.wl .tg{width:34%;background:var(--sel);height:2.6cqw}
.wr{background:#1e1e2e;padding:2.2cqw;font:2cqw/1.7 Consolas,monospace;color:#cdd6f4;white-space:pre}.wr .k{color:#cba6f7}.wr .f{color:#89b4fa}.wr .n{color:#fab387}.wr .c{color:#6c7086}
.kq{position:absolute;right:0;top:0;width:30%;background:var(--bg);border-radius:2cqw;box-shadow:0 1.6cqw 4cqw rgba(60,30,30,.18);padding:1.6cqw;border:1px solid var(--bd)}.kq .q{height:1.6cqw;background:var(--bd);border-radius:1cqw;margin-bottom:1.2cqw}.kq .g{display:grid;grid-template-columns:1fr 1fr;gap:1cqw}.kq .g i{display:flex;align-items:center;justify-content:center;height:5.4cqw;border-radius:1cqw;color:#fff;font-style:normal;font-size:2.4cqw}
.okb{position:absolute;left:0;bottom:12%;background:var(--ok);color:#fff;font-weight:700;font-size:2.4cqw;padding:1.2cqw 2.6cqw;border-radius:99px;box-shadow:0 1.2cqw 3cqw rgba(22,163,74,.35)}
.tmb{position:absolute;left:46%;top:2%;background:var(--bg);border:1px solid var(--bd);font-weight:700;font-size:2.2cqw;padding:.8cqw 2.2cqw;border-radius:99px;box-shadow:var(--sh)}
.mon-art{position:absolute;right:0;bottom:0;width:38%}.mon-art svg{width:100%;height:auto;display:block}
.feats{max-width:1200px;margin:0 auto;padding:20px 28px 120px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.fc{background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:24px;box-shadow:var(--sh)}.fi{width:46px;height:46px;border-radius:12px;background:var(--sel);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:14px}.fc h3{font-size:18px;font-weight:700;margin-bottom:6px}.fc p{color:var(--mut)}
.ban{position:fixed;left:0;right:0;bottom:0;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;gap:20px;padding:12px 50px;z-index:30;font-weight:500;flex-wrap:wrap;text-align:center}.ban .x{cursor:pointer;position:absolute;left:20px}
.authwrap{max-width:430px;margin:50px auto;padding:0 18px}.auth h2{font-size:24px;font-weight:700}
.demo{background:var(--sel);border-left:3px solid var(--acc);padding:8px 10px;font-size:13px;border-radius:6px}
/* экран теста */
#tk{position:fixed;inset:0;z-index:40;background:var(--page);display:flex;flex-direction:column}
.tk-top{min-height:48px;background:var(--bar);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0}
.timer{font-size:18px;color:var(--acc);font-weight:700}.timer.low{color:var(--err)}
.tabs{display:flex;background:var(--side);border-bottom:1px solid var(--bd);flex-shrink:0;overflow-x:auto}
.tab{padding:9px 20px;border-right:1px solid var(--bd);cursor:pointer;color:var(--mut);white-space:nowrap;border-top:3px solid transparent}.tab.on{background:var(--bg);color:var(--tx);border-top-color:var(--acc)}
.tk-body{flex:1;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:12px;padding:12px;min-height:0}
.pane{min-height:0;margin:0}.pane>.pb{overflow:auto;flex:1}.task{font-size:16px;white-space:pre-wrap}
.hintbox{margin-top:16px;border:1px solid var(--bd);border-radius:12px;background:var(--side);padding:12px 14px}.hintbox summary{cursor:pointer;font-weight:700;color:var(--acc)}.hintbox div{white-space:pre-wrap;margin-top:8px;font-size:14px}
.exs{margin-top:16px;font-size:13px}.exs table{width:100%;border-collapse:collapse}.exs td,.exs th{border:1px solid var(--bd);padding:6px 10px;text-align:left;vertical-align:top;white-space:pre}.exs th{color:var(--mut);font-weight:600}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;padding:12px;align-content:stretch}
.kt{border:0;border-radius:14px;color:#fff;font-weight:700;font-size:19px;cursor:pointer;display:flex;align-items:center;gap:14px;padding:18px;min-height:96px;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .1s}.kt:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.kt span.s{font-size:30px;opacity:.9}.kg.picked .kt{opacity:.45}.kg.picked .kt.sel{opacity:1;outline:4px solid var(--tx);outline-offset:2px}
.snips{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd);overflow-x:auto;background:var(--side);font-size:12px}.snips>span{color:var(--mut);white-space:nowrap}
.sn{background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:4px 10px;cursor:pointer;white-space:nowrap;font-family:Consolas,monospace}.sn:hover,.sn.hit{border-color:var(--acc);color:var(--acc);background:var(--sel)}
.edwrap{display:flex;flex:1;min-height:230px;background:var(--ed)}
.gut{margin:0;padding:10px 8px;min-width:44px;text-align:right;color:var(--mut);font-size:14px;line-height:20px;overflow:hidden;border-right:1px solid var(--bd);user-select:none}.gut .eln{color:#fff;background:var(--err);border-radius:3px;display:inline-block;min-width:24px;text-align:center}
.ta{flex:1;background:transparent;color:var(--tx);border:0;outline:0;resize:none;padding:10px;font-size:14px;line-height:20px;white-space:pre;overflow:auto;min-width:0}
.runbar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--bd);background:var(--side);flex-wrap:wrap}.runbar textarea{flex:1;min-width:140px;height:36px;resize:none}
.out{border-top:1px solid var(--bd);background:var(--ed);padding:10px 14px;font-size:13px;max-height:190px;overflow:auto;min-height:56px}.out pre{margin:4px 0;white-space:pre-wrap;font-family:Consolas,monospace;font-size:12px}.out .raw{color:var(--mut)}.out .okb2{margin-top:6px;padding:6px 10px;border-radius:8px;background:var(--ok);color:#fff;font-weight:600;display:inline-block}
.status{min-height:36px;background:var(--acc);color:#fff;display:flex;align-items:center;gap:16px;padding:4px 16px;font-size:13px;flex-shrink:0}.status.hot{background:#c72e0f}
.status button{background:rgba(255,255,255,.25);color:#fff;border:0;padding:5px 18px;cursor:pointer;border-radius:8px;font-weight:700}.status button:hover{background:rgba(255,255,255,.4)}
.mon{position:fixed;inset:0;z-index:60;background:rgba(12,0,0,.94);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.mon-box{border:1px solid #f14c4c;background:#1e1e1e;color:#d4d4d4;padding:22px 30px;max-width:520px;text-align:center;box-shadow:0 0 70px rgba(241,76,76,.5);border-radius:16px}
.mshake{animation:shake .3s infinite;transform-origin:130px 150px}@keyframes shake{0%,100%{transform:rotate(-2.5deg) translateX(-2px)}50%{transform:rotate(2.5deg) translateX(2px)}}
.eye{animation:blink 3.2s infinite;transform-box:fill-box;transform-origin:center}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.mon-art .mshake{animation:none}
@media(max-width:860px){.hm{display:none!important}.nav{gap:8px}.nav .inp{max-width:118px}.nav .grow,.brand+.navmid.hm+select{margin-left:auto}.hero{grid-template-columns:1fr;padding-top:30px;gap:30px}.hero h1{font-size:38px}.nav{padding:8px 14px}.navmid{order:5;width:100%;margin:0;flex:none}.pg h1{font-size:23px}
 .tk-body{grid-template-columns:1fr;overflow:auto;display:block}.tk-body .pane{margin-bottom:12px}.f2,.types{grid-template-columns:1fr}.kt{font-size:16px;min-height:80px}.edwrap{min-height:260px}.content{padding:18px 14px 90px}.savebar{margin:20px -14px -90px}.mon-box{padding:16px}}
.fixb{margin-top:14px;padding:10px 14px;border-radius:12px;background:var(--sel);border-left:4px solid var(--acc);font-size:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#23232f;color:#fff;padding:11px 20px;border-radius:999px;opacity:0;transition:.25s;z-index:90;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}.toast.show{opacity:1;transform:translate(-50%,0)}
.rmod{position:fixed;inset:0;z-index:80;background:rgba(15,15,25,.6);display:flex;align-items:center;justify-content:center;padding:16px}.rbox{background:var(--bg);border-radius:20px;padding:30px 34px;text-align:center;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);display:grid;gap:8px;justify-items:center}
.ring{width:140px;height:140px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--bd) 0);display:flex;align-items:center;justify-content:center;margin-bottom:6px}.ring b{width:108px;height:108px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:30px}.rbox h2{font-size:24px}.rbox .rn{background:var(--sel);padding:6px 12px;border-radius:10px;font-size:13px}.rbox .btn{margin-top:10px}
.tabbar{display:none}
@media(max-width:860px){.tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bar);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}.tabbar a{flex:1;text-align:center;padding:7px 0 6px;font-size:11px;font-weight:600;color:var(--mut);cursor:pointer}.tabbar a i{display:block;font-style:normal;font-size:20px;line-height:1.2}.tabbar a.on{color:var(--acc)}.navmid:not(.hm){display:none}.hs{display:none}.toast{bottom:80px}}
@media(max-width:520px){.kg{grid-template-columns:1fr}.brand small{display:none}.pg h1{font-size:21px}.nav .inp{max-width:96px}.hero h1{font-size:32px}.hl p{font-size:16px}.btn.lg{padding:14px 24px;font-size:16px}.cta{gap:16px}.rbox{padding:24px 18px}}
.btn2.ic{padding:6px 10px;font-size:16px;line-height:1}

/* ===== TestSpace: тёмно-красная тема ===== */
:root{--page:#f3f6fb;--bg:#fff;--side:#f7f9fd;--bd:#e3e8f1;--acc:#ff1f3d;--accd:#d9102d;--sel:#ffe9ec}
.nav{background:#07070a;border-bottom:1px solid #1c1c24;color:#fff}.nav .nl{color:#e8e8ee}.nav .nl.on{color:#fff;border-bottom-color:var(--acc)}
.nav .inp{background:#12121a;color:#fff;border-color:#262633}.nav .btn2{color:#fff;border-color:#262633}.nav .btn2:hover{background:#1a1a24}
.brand b{font-size:22px;letter-spacing:0}.brand b i{color:var(--acc);font-style:normal}.brand small{display:none}
.btn{border-radius:12px;box-shadow:0 8px 22px rgba(255,31,61,.25)}
.hero2{position:relative;min-height:calc(100vh - 68px);background:#050507;overflow:hidden;color:#fff}
.hero2 canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:pan-y}.hero2 canvas:active{cursor:grabbing}
.hc{position:relative;z-index:1;pointer-events:none;padding:12vh 6vw;max-width:780px}.hc .btn{pointer-events:auto}
.hc h1{font-size:clamp(34px,4.6vw,60px);line-height:1.12;font-weight:700}.hc h1 em{color:var(--acc);font-style:normal;display:block}
.hc p{font-size:18px;margin:22px 0 34px;color:#e5e5ea;max-width:420px}
.hint{position:absolute;left:6vw;bottom:5vh;z-index:1;color:#9aa0ad;font-size:14px;pointer-events:none}
.feats{background:#050507;max-width:none;padding:60px max(28px,calc(50vw - 600px)) 100px}.fc{background:#0d0d13;border-color:#1f1f29;color:#fff}.fc p{color:#a1a1ad}.fi{background:#2a0a10}
.authwrap{max-width:900px;margin:40px auto;padding:0 16px}
